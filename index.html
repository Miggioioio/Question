<!DOCTYPE html>
<html>
<head>
  <title>Valentine Quiz</title>
  <style>
    body { 
      text-align:center; 
      font-family:sans-serif; 
      margin:0; 
      padding:0; 
      background:#ffe6f0; 
    }
    button { 
      padding:10px 20px; 
      font-size:18px; 
      margin:10px; 
      cursor:pointer; 
      border:none; 
      border-radius:5px; 
      background:#ff4d6d; 
      color:white; 
    }
    #valentine h1 { 
      font-size:40px; 
      color:#ff1a75; 
      animation: bounce 1s infinite alternate; 
    }
    @keyframes bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .heart {
      position: absolute;
      font-size: 30px;
      animation: float 3s linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity:1; }
      100% { transform: translateY(-500px) rotate(360deg); opacity:0; }
    }
    img { 
      max-width:300px; 
      margin-top:20px; 
      border-radius:10px; 
      display:block;
      margin-left:auto;
      margin-right:auto;
    }

    /* Valentine div styling - hidden at first */
    #valentine {
      display:none;        /* hidden at first */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>

<h1 id="question">Do you love me?</h1>

<!-- Buttons for first question -->
<div id="yesButtons">
  <button onclick="showReally()">Yes ❤️</button>
  <button onclick="showReally()">Yes 😘</button>
</div>

<!-- Single image for both steps -->
<img id="customImage" src="" alt="" style="display:none;">

<!-- Second step button -->
<div id="reallyButton" style="display:none;">
  <button onclick="showReallyReally()">Really? 💌</button>
</div>

<!-- Third step button -->
<div id="reallyReallyButton" style="display:none;">
  <button onclick="showValentine()">Really really? 💖</button>
</div>

<!-- Valentine message -->
<div id="valentine">
  <h1>Will you be my Valentine? 💖</h1>
</div>

<script>
// Hide all dynamic elements
function hideAll() {
  document.getElementById('question').style.display = 'none';
  document.getElementById('yesButtons').style.display = 'none';
  document.getElementById('customImage').style.display = 'none';
  document.getElementById('reallyButton').style.display = 'none';
  document.getElementById('reallyReallyButton').style.display = 'none';
  document.getElementById('valentine').style.display = 'none';
}

// First Yes clicked
function showReally(){
  hideAll();
  document.getElementById('customImage').style.display='block';
  document.getElementById('customImage').src='image1.jpg'; // replace with first image URL
  document.getElementById('reallyButton').style.display='block';
}

// Really? clicked
function showReallyReally(){
  hideAll();
  document.getElementById('customImage').style.display='block';
  document.getElementById('customImage').src='image2.jpg'; // replace with second image URL
  document.getElementById('reallyReallyButton').style.display='block';
}

// Really really? clicked
function showValentine(){
  hideAll();
  document.getElementById('valentine').style.display='flex';
  createHearts();
}

// Hearts animation
function createHearts(){
  for(let i=0; i<30; i++){
    let heart = document.createElement('div');
    heart.className='heart';
    heart.style.left = Math.random()*window.innerWidth+'px';
    heart.style.animationDuration = (2 + Math.random()*3)+'s';
    heart.innerText='❤️';
    document.body.appendChild(heart);
    setTimeout(()=> heart.remove(),5000);
  }
}
</script>

</body>
</html>
